name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Prepare static output
        shell: bash
        run: |
          set -e
          if [ -d ".output/public" ]; then
            cp -R .output/public/. _site/
          elif [ -d "dist" ]; then
            cp -R dist/. _site/
          else
            echo "No static output found"
            find . -maxdepth 3 -type d \( -name dist -o -name public \) -print
            exit 1
          fi
          if [ -f "_site/_shell.html" ]; then cp "_site/_shell.html" "_site/404.html"; elif [ -f "_site/index.html" ]; then cp "_site/index.html" "_site/404.html"; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
